[toolchain]
# Pinned so CI and local development use the same compiler and formatter.
# A new upstream stable release cannot turn CI red (new clippy lints, rustfmt
# drift) without an explicit bump here.
#
# How to bump:
#   1. Update the `channel` below to the new stable version.
#   2. Verify `cargo fmt --all --check`, `cargo clippy --all-targets --locked
#      -- -D warnings`, `cargo test --locked`, and the wasm build all pass.
#   3. Open a dedicated PR so the toolchain bump is reviewable on its own.
#
# Minimum: 1.84 — soroban-sdk requires the wasm32v1-none target.
channel = "1.94.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32v1-none"]
