name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on PRs; never cancel runs on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # soroban-sdk requires the wasm32v1-none target (Rust 1.84+).
  WASM_TARGET: wasm32v1-none

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Reads the channel, components, and targets from rust-toolchain.toml,
        # keeping the version single-sourced.
        uses: dtolnay/rust-toolchain@master

      - name: Resolve toolchain version for cache key
        id: toolchain
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.version }}-
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        if: always()
        run: cargo clippy --all-targets --locked -- -D warnings

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Test
        if: always()
        run: cargo test --locked
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Test & Coverage
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 95

      - name: Build wasm (release)
        if: always()
        run: cargo build --locked --target ${{ env.WASM_TARGET }} --release

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Reject known dependency advisories
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Check licenses, bans, advisories, and sources
        run: cargo deny check advisories licenses bans sources

  reproducible-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify two isolated container builds are byte-for-byte reproducible
        run: ./scripts/build-reproducible.sh