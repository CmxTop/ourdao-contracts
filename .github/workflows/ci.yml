name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # soroban-sdk requires the wasm32v1-none target (Rust 1.84+).
  WASM_TARGET: wasm32v1-none

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # --locked keeps the committed Cargo.lock (which pins ed25519-dalek to
      # 2.2.0) authoritative, so the resolver can't float onto an incompatible
      # transitive release.
      - name: Test & Coverage
        run: cargo llvm-cov --locked --all-targets --fail-under-lines 95

      - name: Build wasm (release)
        run: cargo build --locked --target ${{ env.WASM_TARGET }} --release

  audit:
    runs-on: ubuntu-latest
    # A separate job so a newly published advisory (which can land against a
    # pin we already know about and can't move — see the ed25519-dalek note
    # in the README) surfaces visibly without blocking merges on unrelated PRs.
    steps:
      - uses: actions/checkout@v4

      - name: Audit dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
